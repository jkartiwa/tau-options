[project]
name = "tau"
version = "0.1.0"
description = "Options scanner for premium sellers, over the tastytrade API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "tastytrade>=13.2",
    "python-dotenv>=1.0",
    "rich>=13",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.16"]
# The catalyst read is optional: without it the headlines still show.
catalyst = ["anthropic>=0.117"]

[project.scripts]
tau = "tau.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tau = ["data/*.txt"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
# Strategy definitions keep one leg per line so they read as a table, and the
# docs' code samples are aligned by hand.
exclude = ["src/tau/strategies/*", "*.md"]

[tool.ruff.lint]
# Nothing type-checks the hints, so this at least keeps every signature typed.
extend-select = ["ANN"]
ignore = [
    # Dates are the trader's local calendar day, which is what DTE counts.
    "DTZ011",
    # Every broad catch is a fallback or an error shown to the user.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# Textual's BINDINGS are class-level lists by design.
"src/tau/tui/*" = ["RUF012"]
# Test functions return nothing and take pytest fixtures.
"tests/*" = ["ANN"]
