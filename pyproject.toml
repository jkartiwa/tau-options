[project]
name = "tau"
version = "0.1.0"
description = "Premium-selling options scanner"
requires-python = ">=3.12"
dependencies = [
    "tastytrade>=13.2",
    "python-dotenv>=1.0",
    "rich>=13",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
# The catalyst read is optional: without it the headlines still show.
catalyst = ["anthropic>=0.117"]

[project.scripts]
tau = "tau.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tau = ["data/*.txt"]
