[project]
name = "tau"
version = "0.1.0"
description = "Premium-selling options scanner"
requires-python = ">=3.12"
dependencies = [
    "tastytrade>=13.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tau = "tau.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tau = ["data/*.txt"]
